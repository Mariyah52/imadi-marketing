name: IMADI daily posts

on:
  schedule:
    # GitHub's scheduler often starts runs late or skips them, so this checks every hour
    # (UTC, Monday to Saturday) and posts whichever slot is due and not yet posted.
    # Slot times (11am, 3pm, 7pm Pakistan time) and formats are in bot/config.py.
    - cron: '7 * * * 1-6'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run'
        type: choice
        options: [morning, afternoon, evening]
        default: evening
      format:
        description: 'Force a format (auto = follow the schedule)'
        type: choice
        options: [auto, post, carousel, reel]
        default: auto
      dry_run:
        description: 'Build only, do not post'
        type: boolean
        default: false

permissions:
  contents: write   # to push images and videos to the "media" branch

concurrency:
  group: imadi-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick the slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "slot=auto" >> "$GITHUB_OUTPUT"
          else
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Anything due?
        id: due
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.slot.outputs.slot }}" != "auto" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys; sys.path.insert(0, ".")
          from datetime import datetime, timezone
          from bot import schedule, host
          today = datetime.now(timezone.utc).astimezone(schedule.PKT).date().isoformat()
          print("go=" + ("yes" if schedule.due_slot(host.posted_today(today)) else "no"))
          PY

      - uses: actions/setup-python@v5
        if: steps.due.outputs.go == 'yes'
        with:
          python-version: '3.12'

      - name: Install tools
        if: steps.due.outputs.go == 'yes'
        timeout-minutes: 15
        run: |
          # Ubuntu's package mirrors sometimes stall; time-box each try and retry.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            timeout 240 sudo apt-get $APT update -qq && \
            timeout 300 sudo apt-get $APT install -y -qq ffmpeg fonts-noto-color-emoji && break
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          which ffmpeg ffprobe
          mkdir -p ~/.local/share/fonts && cp assets/fonts/*.otf ~/.local/share/fonts/ && fc-cache -f
          pip install -r requirements.txt
          timeout 300 python -m playwright install chromium
          timeout 300 sudo -E env "PATH=$PATH" python -m playwright install-deps chromium || echo "Browser system libraries step skipped"

      - name: Install speech recognition (only when a clip is waiting)
        if: steps.due.outputs.go == 'yes' && hashFiles('clips/inbox/*.mp4', 'clips/inbox/*.MP4', 'clips/inbox/*.mov', 'clips/inbox/*.MOV', 'clips/inbox/*.m4v') != ''
        run: pip install -r requirements-clips.txt

      - name: Build and post
        if: steps.due.outputs.go == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
          FORCE_FORMAT: ${{ github.event.inputs.format }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python -m bot.main

      - name: Keep a copy of what was made
        if: always() && steps.due.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: imadi-post-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
