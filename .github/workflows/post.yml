name: IMADI daily posts

on:
  schedule:
    # Cron is in UTC. Pakistan is UTC+5, so 06:00 = 11am, 10:00 = 3pm, 14:00 = 7pm.
    # Monday to Saturday (1-6). Which format goes out in each slot is set in bot/config.py.
    - cron: '0 6 * * 1-6'
    - cron: '0 10 * * 1-6'
    - cron: '0 14 * * 1-6'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run'
        type: choice
        options: [morning, afternoon, evening]
        default: evening
      format:
        description: 'Force a format (auto = follow the schedule)'
        type: choice
        options: [auto, post, carousel, reel]
        default: auto
      dry_run:
        description: 'Build only, do not post'
        type: boolean
        default: false

permissions:
  contents: write   # to push images and videos to the "media" branch

concurrency:
  group: imadi-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick the slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 6 * * 1-6")  echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * 1-6") echo "slot=afternoon" >> "$GITHUB_OUTPUT" ;;
            "0 14 * * 1-6") echo "slot=evening" >> "$GITHUB_OUTPUT" ;;
            *)              echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          mkdir -p ~/.local/share/fonts && cp assets/fonts/*.otf ~/.local/share/fonts/ && fc-cache -f
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build and post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
          FORCE_FORMAT: ${{ github.event.inputs.format }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python -m bot.main

      - name: Keep a copy of what was made
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imadi-post-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
